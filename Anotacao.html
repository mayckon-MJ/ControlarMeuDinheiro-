
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloco de Nota</title>
  <style>
    /* RESET & VARIÁVEIS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --primary-purple: #7B2FF7;
      --bg-editor-default: #F5EEFF;
      --transition: 300ms ease;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      color: #222;
      overflow-x: hidden;
    }

    /* TELA PRINCIPAL */
    #main-screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .main-header {    
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }

    .app-title {
      text-align: center;
      color: #7B2FF7;
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* BOTÃO FAB SUPERIOR DIREITO */
    .fab-btn {
      position: fixed;
      top: 535px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-purple);
      color: #FFF;
      border: none;
      font-size: 32px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(123, 47, 247, 0.35);
      cursor: pointer;
      z-index: 100;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* CONTROLES E PESQUISA */
        /* CONTROLES E PESQUISA */
    .controls {
      max-width: 900px;
      margin: 0 auto 24px auto;
      display: flex; /* Mudado de block para flex para alinhar os elementos corretamente */
      flex-direction: column; /* Organiza a busca e a ordenação em linhas separadas */
      gap: 12px;
    }

    /* ... mantendo o restante do CSS da ordenação intacto ... */

    .search-input {
      width: 100%; /* Faz o campo ocupar 100% da largura disponível */
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(245, 238, 255, 0.4);
      outline: none;
      font-size: 0.95rem;
      transition: border var(--transition);
    }


      /* CONTROLES DE ORDENAÇÃO CUSTOMIZADOS */
    .sort-dropdown {
      position: relative;
      display: inline-block;
    }

    .btn-sort-trigger {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(245, 238, 255, 0.4);
      outline: none;
      font-size: 0.5rem;
      color: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border var(--transition), background var(--transition);
    }

    .btn-sort-trigger:hover {
      background: #FFF;
      border-color: var(--primary-purple);
    }

    .sort-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 170px;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity var(--transition), transform var(--transition);
    }

    .sort-menu.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .sort-item {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: transparent;
      text-align: left;
      font-size: 0.9rem;
      color: #333;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .sort-item:hover, .sort-item.selected {
      background: rgba(123, 47, 247, 0.1);
      color: var(--primary-purple);
      font-weight: 600;
    }

    .search-input, .sort-select {
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(245, 238, 255, 0.4);
      outline: none;
      font-size: 0.95rem;
      transition: border var(--transition);
    }

    .search-input { flex: 1; min-width: 200px; }
    .search-input:focus { border-color: var(--primary-purple); background: #FFF; }

    /* LISTA DE NOTAS */
    .notes-grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .note-card {
      position: relative;
      padding: 18px;
      border-radius: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border: 1px solid rgba(255,255,255,0.6);
      transition: transform var(--transition);
      user-select: none;
    }
  
    .note-card:active { transform: scale(0.98); }
    .card-title { font-weight: 700; margin-bottom: 6px; font-size: 1.05rem; }
    .card-body { display: flex; gap: 10px; font-size: 0.88rem; color: #555; }
    .card-thumb { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; flex-shrink: 0; background: #eee; }
    .card-snippet { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .card-date { font-size: 0.75rem; color: #888; margin-top: 10px; }

    /* TELA CHEIA DO EDITOR */
    #editor-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-editor-default);
      z-index: 200;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), background-color var(--transition);
    }

    #editor-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .editor-header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      gap: 10px;
      overflow-x: auto;
    }

    .toolbar { display: flex; gap: 8px; align-items: center; }

    .btn-tool {
      border: none;
      background: rgba(123, 47, 247, 0.08);
      color: var(--primary-purple);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform var(--transition), background var(--transition);
      white-space: nowrap;
    }

    .btn-tool:active { transform: scale(0.94); }
    .btn-save { background: var(--primary-purple); color: #FFF; }

    /* ÁREA DE EDIÇÃO DE TEXTO */
    .editor-body {
      flex: 1;
      padding: 24px 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    .note-editor {
      width: 100%;
      min-height: 80vh;
      outline: none;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #222;
      word-wrap: break-word;
      white-space: break-spaces;
    }

    .note-editor[placeholder]:empty:before {
      content: attr(placeholder);
      color: #999;
    }

    /* IMAGEM INLINE NO LUGAR EXATO DO CURSOR */
    .note-editor img.inline-img {
      max-width: 45px;
      max-height: 45px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      display: inline-block;
      vertical-align: middle;
      margin: 0 4px;
      cursor: pointer;
      user-select: auto;
    }

    /* HIGHLIGHT DO BLOCO */
    .block-highlight {
      background-color: rgba(123, 47, 247, 0.15);
      border-radius: 6px;
      padding: 2px 6px;
      margin: 0 1px;
      display: inline;
    }

    /* PAINEL DE COR DE TEXTO */
    .text-color-bar {
      display: none;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.9);
      overflow-x: auto;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .text-color-bar.active { display: flex; }

    /* MODAIS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      padding: 20px;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title { font-weight: 700; text-align: center; font-size: 1.1rem; }
    .modal-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 0.95rem;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    /* GRADE DE 30 CORES */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
    }

    .color-dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--transition);
    }

    .color-dot:active { transform: scale(0.85); }
    .color-dot.selected {
      border-color: #FFF;
      box-shadow: 0 0 0 2px var(--primary-purple);
      transform: scale(1.1);
    }

.note-title-input {
  width: 100%;
  max-width: 800px;
  margin: 10px auto 0 auto;
  display: block;
  padding: 5px 8px;
  border: 1px solid rgba(123, 47, 247, 0.2);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.8);
  outline: none;
  font-size: 1.2rem;
  font-weight: 700;
  text-align: center;
  color: #222;
  transition: border var(--transition), box-shadow var(--transition);
}

.note-title-input:focus {
  border-color: var(--primary-purple);
  box-shadow: 0 0 8px rgba(123, 47, 247, 0.2);
  background: #FFF;
}

    /* TELA CHEIA DE VISUALIZAÇÃO */
    #view-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      z-index: 250;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), background-color var(--transition);
    }

    #view-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .view-header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .view-body {
      flex: 1;
      padding: 24px 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    .view-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

        .view-content {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #222;
      word-wrap: break-word;
      white-space: break-spaces;
    }

    /* ADICIONE ESTE BLOCO LOGO ABAIXO */
    .view-content img {
      max-width: 45px !important;
      max-height: 45px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      display: inline-block !important;
      vertical-align: middle !important;
      margin: 0 4px !important;
    }


    

  </style>
</head>
<body>

  <!-- TELA PRINCIPAL -->
  <main id="main-screen">
    <button class="fab-btn" id="btn-fab" title="Nova Anotação">+</button>
    <header class="main-header">
      <img src="Bloco-Nota.png" alt="Descrição da imagem" style="display: block; margin: 0 auto; width: 40px; height: 40px; border-radius: 12px; object-fit: cover;">
      <h1 class="app-title">Anotações</h1>
      
    </header>
    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Pesquisar...">
      
      <div class="sort-dropdown">
        <button type="button" class="btn-sort-trigger" id="btn-sort-trigger">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="15" y2="12"></line>
            <line x1="3" y1="18" x2="9" y2="18"></line>
          </svg>
          <span id="sort-label">Mais recentes</span>
        </button>
        <div class="sort-menu" id="sort-menu">
          <button type="button" class="sort-item selected" data-value="recent">Mais recentes</button>
          <button type="button" class="sort-item" data-value="oldest">Mais antigas</button>
          <button type="button" class="sort-item" data-value="az">A-Z</button>
          <button type="button" class="sort-item" data-value="za">Z-A</button>
        </div>
      </div>
    </div>

    <section id="notes-grid" class="notes-grid"></section>
  </main>
  <!-- TELA CHEIA DE VISUALIZAÇÃO -->
  <div id="view-screen">
    <header class="view-header">
      <button class="btn-tool" id="btn-view-back">← Voltar</button>
    </header>
    <div class="view-body">
      <h2 id="view-title" class="view-title"></h2>
      <div id="view-content" class="view-content"></div>
    </div>
  </div>

  <!-- TELA CHEIA DO EDITOR -->
  <div id="editor-screen">
    <header class="editor-header">
      <button class="btn-tool" id="btn-back">← Voltar</button>
      <div class="toolbar">
        <button class="btn-tool" id="btn-text">Texto</button>
        <button class="btn-tool" id="btn-img" title="Imagem">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button class="btn-tool" id="btn-color">Cor</button>
        <button class="btn-tool" id="btn-block">Bloco +/-</button>          
        <button class="btn-tool" id="btn-align" title="Alinhamento">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
        </button>
        <button class="btn-tool" id="btn-bold" title="Negrito"><b>B</b></button>
        <button class="btn-tool" id="btn-font" title="Fonte">Fonte</button>
        <button class="btn-tool" id="btn-size" title="Tamanho">Tamanho</button>

      </div>
      <button class="btn-tool btn-save" id="btn-save">Salvar</button>
    </header>

    <input type="text" id="note-title-input" class="note-title-input" placeholder="Nome da anotação...">
    <!-- PALETA DE COR DE TEXTO -->
    <div id="text-color-bar" class="text-color-bar"></div>

    <div class="editor-body">
      <div id="note-editor" class="note-editor" contenteditable="true" placeholder="Comece a escrever..."></div>
    </div>
  </div>

      <!-- MODAL BLOCO (+ / - / COR) -->
  <div class="modal-overlay" id="modal-block">
    <div class="modal-card">
      <h3 class="modal-title">Opções de Bloco</h3>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn-tool" id="btn-block-add" style="flex: 1; justify-content: center;">+</button>
        <button class="btn-tool" id="btn-block-remove" style="flex: 1; justify-content: center;">-</button>
      </div>
      <button class="btn-tool" id="btn-block-color-open" style="justify-content: center;">Cor</button>
      <div class="modal-actions">
        <button class="btn-tool btn-save" id="btn-confirm-block">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL COR DO BLOCO -->
  <div class="modal-overlay" id="modal-block-color">
    <div class="modal-card">
      <h3 class="modal-title">Cor do Bloco</h3>
      <div class="color-grid" id="block-color-grid"></div>
      <div class="modal-actions">
        <button class="btn-tool btn-save" id="btn-confirm-block-color">OK</button>
      </div>
    </div>
  </div>

  <!-- MODAL ALINHAMENTO DO TEXTO -->
  <div class="modal-overlay" id="modal-align">
    <div class="modal-card">
      <h3 class="modal-title">Alinhamento do Texto</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-tool" id="btn-align-left" style="justify-content: center;">Esquerda</button>
        <button class="btn-tool" id="btn-align-center" style="justify-content: center;">Centralizar</button>
        <button class="btn-tool" id="btn-align-right" style="justify-content: center;">Direita</button>
        <button class="btn-tool" id="btn-align-justify" style="justify-content: center;">Justificado</button>
      </div>
    </div>
  </div>
   
  <!-- MODAL SELEÇÃO DE FONTE -->
  <div class="modal-overlay" id="modal-font">
    <div class="modal-card">
      <h3 class="modal-title">Escolha a Fonte</h3>
      <div style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;">
        <button class="btn-tool" id="btn-font-sans" style="justify-content: center; font-family: sans-serif;">Padrão (Sans-Serif)</button>
        <button class="btn-tool" id="btn-font-serif" style="justify-content: center; font-family: Georgia, serif;">Serifada (Georgia)</button>
        <button class="btn-tool" id="btn-font-mono" style="justify-content: center; font-family: monospace;">Monospaçada (Courier)</button>
        <button class="btn-tool" id="btn-font-cursive" style="justify-content: center; font-family: cursive;">Cursiva</button>
      </div>
    </div>
  </div>

  <!-- MODAL TAMANHO DA FONTE -->
  <div class="modal-overlay" id="modal-size">
    <div class="modal-card">
      <h3 class="modal-title">Tamanho do Texto</h3>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
        <button class="btn-tool" id="btn-size-1" style="justify-content: center;">Muito Pequeno</button>
        <button class="btn-tool" id="btn-size-2" style="justify-content: center;">Pequeno</button><br>
        <button class="btn-tool" id="btn-size-3" style="justify-content: center;">Normal</button>
        <button class="btn-tool" id="btn-size-4" style="justify-content: center;">Médio</button><br> 
        <button class="btn-tool" id="btn-size-5" style="justify-content: center;">Grande</button>
        <button class="btn-tool" id="btn-size-6" style="justify-content: center;">Muito Grande</button>
      </div>
    </div>
  </div>
    
  <!-- MODAL IMAGEM -->
  <div class="modal-overlay" id="modal-img">
    <div class="modal-card">
      <h3 class="modal-title">Inserir Imagem</h3>
      <input type="url" id="img-url-input" class="modal-input" placeholder="Cole o link da imagem...">
      <div class="modal-actions">
        <button class="btn-tool" id="btn-cancel-img">Cancelar</button>
        <button class="btn-tool btn-save" id="btn-confirm-img">OK</button>
      </div>
    </div>
  </div>

  <!-- MODAL COR DE FUNDO (30 CORES) -->
  <div class="modal-overlay" id="modal-bg-color">
    <div class="modal-card">
      <h3 class="modal-title">Cor do Fundo</h3>
      <div class="color-grid" id="bg-color-grid"></div>
      <div class="modal-actions">
        <button class="btn-tool btn-save" id="btn-confirm-bg-color">OK</button>
      </div>
    </div>
  </div>

  <!-- MODAL EXCLUIR NOTA -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal-card">
      <h3 class="modal-title">Excluir Anotação</h3>
      <p style="text-align:center; color:#666;">Deseja apagar esta anotação?</p>
      <div class="modal-actions">
        <button class="btn-tool" id="btn-cancel-delete">Cancelar</button>
        <button class="btn-tool btn-save" style="background:#e53935;" id="btn-confirm-delete">Excluir</button>
      </div>
    </div>
  </div>

  <script>
    // ESTADO
    let notes = JSON.parse(localStorage.getItem('minimal_notes')) || [];
    let currentNoteId = null;
    let selectedBgColor = '#F5EEFF';
    let tempBgColor = '#F5EEFF';
    let selectedBlockColor = 'rgba(123, 47, 247, 0.15)';
    let tempBlockColor = 'rgba(123, 47, 247, 0.15)';
    let blockAction = null; // 'add' ou 'remove'
    let savedRange = null;
    let pressTimer = null;
    let currentSort = 'recent';

    // PALETA 30 CORES
    const palette30 = [
      '#F5EEFF', '#FFFFFF', '#FFEBEE', '#FCE4EC', '#F3E5F5', '#EDE7F6',
      '#E8EAF6', '#E3F2FD', '#E0F7FA', '#E0F2F1', '#E8F5E9', '#F1F8E9',
      '#F9FBE7', '#FFFDE7', '#FFF8E1', '#FFF3E0', '#FBE9E7', '#EFEBE9',
      '#7B2FF7', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6',
      '#374151', '#4B5563', '#9CA3AF', '#D1D5DB', '#BE185D', '#000000'
    ];

    // ELEMENTOS
    const mainScreen = document.getElementById('main-screen');
    const editorScreen = document.getElementById('editor-screen');
    const editor = document.getElementById('note-editor');
    const notesGrid = document.getElementById('notes-grid');
    const textColorBar = document.getElementById('text-color-bar');
    const noteTitleInput = document.getElementById('note-title-input');
    const viewScreen = document.getElementById('view-screen');
    const viewTitle = document.getElementById('view-title');
    const viewContent = document.getElementById('view-content');

    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      bindEvents();
    });

        function initApp() {
      renderBgPalette();
      renderTextColorPalette();
      renderBlockPalette();
      renderNotesList();
    }

    function renderBlockPalette() {
      const grid = document.getElementById('block-color-grid');
      grid.innerHTML = '';
      palette30.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = color;
        if (color === '#FFFFFF') dot.style.border = '1px solid #ccc';
        dot.addEventListener('click', () => {
          grid.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
          dot.classList.add('selected');
          tempBlockColor = color;
        });
        grid.appendChild(dot);
      });
    }


    // NAVEGAÇÃO E EDITOR
    function openViewer(noteId, e) {
      if (e) e.stopPropagation(); // Evita abrir o editor ao clicar no olho
      const note = notes.find(n => n.id === noteId);
      if (!note) return;

      viewTitle.innerText = note.title;
      viewContent.innerHTML = note.content.replace(/<img /g, '<img class="inline-img" ');
      viewScreen.style.backgroundColor = note.bgColor || '#FFFFFF';
      viewScreen.classList.add('active');
    }
    }

    function closeViewer() {
      viewScreen.classList.remove('active');
    }

    function openEditor(noteId = null) {
      currentNoteId = noteId;
      if (noteId) {
        const note = notes.find(n => n.id === noteId);
        editor.innerHTML = note.content;
        noteTitleInput.value = note.title || ''; // Carrega o título salvo
        selectedBgColor = note.bgColor || '#F5EEFF';
      } else {
        editor.innerHTML = '';
        noteTitleInput.value = ''; // Limpa o título para nova nota
        selectedBgColor = '#F5EEFF';
      }
      editorScreen.style.backgroundColor = selectedBgColor;
      editorScreen.classList.add('active');
      setTimeout(() => focusAtEnd(), 300);
    }
    
    function closeEditor() {
      editorScreen.classList.remove('active');
      textColorBar.classList.remove('active');
      currentNoteId = null;
      renderNotesList();
    }

    function focusAtEnd() {
      editor.focus();
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function saveNote() {
      const content = editor.innerHTML;
      const plainText = editor.innerText.trim();
      if (!content.trim() && !plainText) { closeEditor(); return; }

      const customTitle = noteTitleInput.value.trim();
      const words = plainText.split(/\s+/).filter(w => w.length > 0);
      const title = customTitle || words.slice(0, 6).join(' ') || 'Anotação';

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = content;
      const firstImg = tempDiv.querySelector('img');
      const thumb = firstImg ? firstImg.src : null;

      const dateStr = `${new Date().toLocaleDateString('pt-BR')} <span style=" font-weight: 600;">${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>`;
      
      if (currentNoteId) {
        const idx = notes.findIndex(n => n.id === currentNoteId);
        if (idx !== -1) {
          notes[idx] = { ...notes[idx], title, content, plainText, thumb, bgColor: selectedBgColor, date: dateStr, ts: Date.now() };
        }
      } else {
        notes.unshift({ id: 'note_' + Date.now(), title, content, plainText, thumb, bgColor: selectedBgColor, date: dateStr, ts: Date.now() });
      }

      localStorage.setItem('minimal_notes', JSON.stringify(notes));
      closeEditor();
    }

    // PALETAS
    function renderBgPalette() {
      const grid = document.getElementById('bg-color-grid');
      grid.innerHTML = '';
      palette30.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = color;
        if (color === '#FFFFFF') dot.style.border = '1px solid #ccc';
        dot.addEventListener('click', () => {
          grid.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
          dot.classList.add('selected');
          tempBgColor = color;
        });
        grid.appendChild(dot);
      });
    }

    function renderTextColorPalette() {
      textColorBar.innerHTML = '';
      palette30.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.width = '28px';
        dot.style.height = '28px';
        dot.style.flexShrink = '0';
        dot.style.backgroundColor = color;
        if (color === '#FFFFFF') dot.style.border = '1px solid #ccc';
        dot.addEventListener('mousedown', (e) => {
  e.preventDefault();
  document.execCommand('foreColor', false, color);
});

        textColorBar.appendChild(dot);
      });
    }

    // MANIPULAÇÃO DE CURSOR E IMAGEM
    function saveSelection() {
      const sel = window.getSelection();
      if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
    }

    function restoreSelection() {
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    function insertImage(url) {
      restoreSelection();
      editor.focus();

      const img = document.createElement('img');
      img.src = url;
      img.className = 'inline-img';

      const sel = window.getSelection();
      let range = (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) ? sel.getRangeAt(0) : document.createRange();

      range.insertNode(img);
      const newRange = document.createRange();
      newRange.setStartAfter(img);
      newRange.setEndAfter(img);
      sel.removeAllRanges();
      sel.addRange(newRange);
    }

function openBlockModal() {
  const sel = window.getSelection();
  if (sel.isCollapsed || sel.rangeCount === 0) return;

  const editorEl = document.getElementById('note-editor');
  if (!editorEl.contains(sel.anchorNode) || !editorEl.contains(sel.focusNode)) return;

  saveSelection();
  blockAction = null;
  document.getElementById('btn-block-add').style.opacity = '1';
  document.getElementById('btn-block-remove').style.opacity = '1';
  openModal('modal-block');
}

function executeBlockAction() {
  restoreSelection();
  const sel = window.getSelection();
  if (sel.isCollapsed || sel.rangeCount === 0) {
    closeModal('modal-block');
    return;
  }

  const range = sel.getRangeAt(0);
  let parent = range.commonAncestorContainer;
  if (parent.nodeType === 3) parent = parent.parentNode;

  const blockSpan = parent.closest('.block-highlight');

  if (blockAction === 'remove') {
    if (blockSpan) {
      const parentNode = blockSpan.parentNode;
      while (blockSpan.firstChild) {
        parentNode.insertBefore(blockSpan.firstChild, blockSpan);
      }
      parentNode.removeChild(blockSpan);
    }
  } else if (blockAction === 'add') {
    if (blockSpan) {
      blockSpan.style.backgroundColor = selectedBlockColor;
    } else {
      const span = document.createElement('span');
      span.className = 'block-highlight';
      span.style.backgroundColor = selectedBlockColor;
      try {
        range.surroundContents(span);
      } catch (e) {
        const frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }
    }
  }

  closeModal('modal-block');
}

    function openAlignModal() {
      saveSelection();
      openModal('modal-align');
    }

    function setAlign(alignType) {
      restoreSelection();
      editor.focus();
      document.execCommand(alignType, false, null);
      closeModal('modal-align');
    }
    
    function toggleBold() {
      document.execCommand('bold', false, null);
      editor.focus();
    }

    function applyFontName(fontName) {
      restoreSelection();
      editor.focus();
      document.execCommand('fontName', false, fontName);
      closeModal('modal-font');
    }

    function applyFontSize(sizeValue) {
      restoreSelection();
      editor.focus();
      document.execCommand('fontSize', false, sizeValue);
      closeModal('modal-size');
    }
    
    // RENDERIZAÇÃO DA LISTA
    function renderNotesList() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const sort = currentSort;

      let filtered = notes.filter(n => n.title.toLowerCase().includes(query) || n.plainText.toLowerCase().includes(query));

      filtered.sort((a, b) => {
        if (sort === 'recent') return b.ts - a.ts;
        if (sort === 'oldest') return a.ts - b.ts;
        if (sort === 'az') return a.title.localeCompare(b.title);
        if (sort === 'za') return b.title.localeCompare(a.title);
        return 0;
      });

      notesGrid.innerHTML = '';
            filtered.forEach(note => {
        const card = document.createElement('article');
        card.className = 'note-card';
        card.style.backgroundColor = note.bgColor || '#F5EEFF';

        card.addEventListener('click', () => openEditor(note.id));
        setupLongPress(card, note.id);

        card.innerHTML = `
          <div style="position: absolute; top: 40px; right: 14px; display: flex; gap: 8px; align-items: center; z-index: 10;">
            <svg class="btn-eye" data-id="${note.id}" style="color: #7B2FF7; cursor: pointer;" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <div style="position: absolute; top: 3px; right: 300px; display: flex; gap: 8px; align-items: center; z-index: 10;">        
            <svg style="color: #7B2FF7; pointer-events: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </div>
          <div>
            <div class="card-title">${escapeHtml(note.title)}</div>
            <div class="card-body">
              ${note.thumb ? `<img src="${note.thumb}" class="card-thumb" alt="thumb">` : ''}
              <div class="card-snippet">${escapeHtml(note.plainText)}</div>
            </div>
          </div>
          <div class="card-date">${note.date}</div>
        `;

        // Evento de clique no botão do olho
        const eyeBtn = card.querySelector('.btn-eye');
        eyeBtn.addEventListener('click', (e) => openViewer(note.id, e));

        notesGrid.appendChild(card);
      });
    }

    function setupLongPress(element, id) {
      const start = () => { pressTimer = setTimeout(() => { currentNoteId = id; openModal('modal-delete'); }, 600); };
      const cancel = () => clearTimeout(pressTimer);
      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchend', cancel);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', cancel);
      element.addEventListener('mouseleave', cancel);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // EVENTOS
    function bindEvents() {
      document.getElementById('btn-fab').addEventListener('click', () => openEditor());
      document.getElementById('btn-back').addEventListener('click', closeEditor);
      document.getElementById('btn-save').addEventListener('click', saveNote);
      document.getElementById('btn-view-back').addEventListener('click', closeViewer);

      document.getElementById('btn-text').addEventListener('click', () => {
        textColorBar.classList.toggle('active');
        editor.focus();
      });

      document.getElementById('btn-img').addEventListener('click', () => {
        saveSelection();
        openModal('modal-img');
      });

      document.getElementById('btn-confirm-img').addEventListener('click', () => {
        const url = document.getElementById('img-url-input').value.trim();
        if (url) {
          insertImage(url);
          document.getElementById('img-url-input').value = '';
          closeModal('modal-img');
        }
      });

      document.getElementById('btn-cancel-img').addEventListener('click', () => closeModal('modal-img'));

      document.getElementById('btn-color').addEventListener('click', () => openModal('modal-bg-color'));
      document.getElementById('btn-confirm-bg-color').addEventListener('click', () => {
        selectedBgColor = tempBgColor;
        editorScreen.style.backgroundColor = selectedBgColor;
        closeModal('modal-bg-color');
      });

            document.getElementById('btn-block').addEventListener('click', openBlockModal);

      document.getElementById('btn-block-add').addEventListener('click', () => {
        blockAction = 'add';
        document.getElementById('btn-block-add').style.opacity = '1';
        document.getElementById('btn-block-remove').style.opacity = '0.5';
      });

      document.getElementById('btn-block-remove').addEventListener('click', () => {
        blockAction = 'remove';
        document.getElementById('btn-block-remove').style.opacity = '1';
        document.getElementById('btn-block-add').style.opacity = '0.5';
      });

      document.getElementById('btn-block-color-open').addEventListener('click', () => {
        openModal('modal-block-color');
      });

      document.getElementById('btn-confirm-block-color').addEventListener('click', () => {
        selectedBlockColor = tempBlockColor;
        closeModal('modal-block-color');
      });

      document.getElementById('btn-confirm-block').addEventListener('click', executeBlockAction);

      document.getElementById('btn-confirm-delete').addEventListener('click', () => {
        if (currentNoteId) {
          notes = notes.filter(n => n.id !== currentNoteId);
          localStorage.setItem('minimal_notes', JSON.stringify(notes));
          renderNotesList();
        }
        closeModal('modal-delete');
      });

      document.getElementById('btn-cancel-delete').addEventListener('click', () => closeModal('modal-delete'));

      document.getElementById('btn-align').addEventListener('click', openAlignModal);

      document.getElementById('btn-align-left').addEventListener('click', () => setAlign('justifyLeft'));
      document.getElementById('btn-align-center').addEventListener('click', () => setAlign('justifyCenter'));
      document.getElementById('btn-align-right').addEventListener('click', () => setAlign('justifyRight'));
      document.getElementById('btn-align-justify').addEventListener('click', () => setAlign('justifyFull'));
        
      document.getElementById('btn-bold').addEventListener('click', toggleBold);

      document.getElementById('btn-font').addEventListener('click', () => {
        saveSelection();
        openModal('modal-font');
      });

      document.getElementById('btn-size').addEventListener('click', () => {
        saveSelection();
        openModal('modal-size');
      });

      // Eventos das fontes
      document.getElementById('btn-font-sans').addEventListener('click', () => applyFontName('sans-serif'));
      document.getElementById('btn-font-serif').addEventListener('click', () => applyFontName('Georgia, serif'));
      document.getElementById('btn-font-mono').addEventListener('click', () => applyFontName('monospace'));
      document.getElementById('btn-font-cursive').addEventListener('click', () => applyFontName('cursive'));

      // Eventos dos tamanhos
      document.getElementById('btn-size-1').addEventListener('click', () => applyFontSize('1'));
      document.getElementById('btn-size-2').addEventListener('click', () => applyFontSize('2'));
      document.getElementById('btn-size-3').addEventListener('click', () => applyFontSize('3'));
      document.getElementById('btn-size-4').addEventListener('click', () => applyFontSize('4'));
      document.getElementById('btn-size-5').addEventListener('click', () => applyFontSize('5'));
      document.getElementById('btn-size-6').addEventListener('click', () => applyFontSize('6'));
        
       
      document.getElementById('search-input').addEventListener('input', renderNotesList);
      
   // Lógica do menu customizado de ordenação
      const sortTrigger = document.getElementById('btn-sort-trigger');
      const sortMenu = document.getElementById('sort-menu');
      const sortLabel = document.getElementById('sort-label');

      sortTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        sortMenu.classList.toggle('active');
      });

      document.querySelectorAll('.sort-item').forEach(item => {
        item.addEventListener('click', (e) => {
          document.querySelectorAll('.sort-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');

          currentSort = item.getAttribute('data-value');
          sortLabel.innerText = item.innerText;
          sortMenu.classList.remove('active');

          renderNotesList();
        });
      });

      // Fechar o menu se clicar fora dele
      document.addEventListener('click', () => {
        sortMenu.classList.remove('active');
      });

      }
  </script>
</body>
