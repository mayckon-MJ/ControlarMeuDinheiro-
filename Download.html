<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibePlay</title>
  
  <!-- ==========================================
       ESTILOS (CSS) - ROXO E EFEITO VIDRO
       ========================================== -->
  <style>
    /* RESET BÁSICO */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* FUNDO DA TELA COM GRADIENTE ROXO */
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2a0845 0%, #6441A5 50%, #4a00e0 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 15px;
      color: #ffffff;
    }

    /* CONTAINER PRINCIPAL (CONTAINER COM EFEITO VIDRO) */
    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 1. NOME DO SISTEMA NO TOPO (CENTRALIZADO) */
    .app-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* 2. ABAS (VÍDEOS E MÚSICAS) */
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(229, 57, 53, 0.15); /* Fundo vermelho bem fraquinho */
      color: rgba(255, 255, 255, 0.8); /* Texto fraco */
      border: 1px solid rgba(229, 57, 53, 0.3);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: rgba(229, 57, 53, 0.35); /* Destaque quando ativo */
      color: #ffffff;
      border-color: rgba(229, 57, 53, 0.6);
      box-shadow: 0 0 12px rgba(229, 57, 53, 0.3);
    }

    /* 3. CAMPO DE BUSCA COM A LUPA */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      padding: 10px 8px;
      font-size: 0.95rem;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .search-btn:active {
      transform: scale(0.9);
    }

    /* MENSAGEM DE CARREGAMENTO (LOADING) */
    .loading-text {
      display: none;
      text-align: center;
      font-size: 0.95rem;
      color: #d1c4e9;
    }

    /* 4. CARD DE RESULTADOS (COM VIDRO INTERNO) */
    .result-card {
      display: none; /* Inicia oculto até a pesquisa */
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-direction: column;
      gap: 16px;
    }

    /* CABEÇALHO DO CARD (CAPA E TÍTULO) */
    .video-info {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .video-thumb {
      width: 90px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .video-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .video-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* SEÇÕES DE OPÇÕES (MÚSICA / VÍDEO) */
    .options-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* OPÇÃO SELECCIONÁVEL (RADIO CUSTOMIZADO) */
    .option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.2s ease;
    }

    .option-item:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .option-item input[type="radio"] {
      accent-color: #ff3b30;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .option-label {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
    }

    .option-quality {
      font-weight: 700;
      color: #ffffff;
    }

    .option-size {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* BOTÃO GUARDAR */
    .btn-save {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      background: #ff3b30;
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(255, 59, 48, 0.4);
      transition: transform 0.2s ease, background 0.2s ease;
      margin-top: 8px;
    }

    .btn-save:active {
      transform: scale(0.98);
      background: #e03228;
    }
  </style>
</head>
<body>

  <!-- CONTAINER PRINCIPAL -->
  <div class="container">
    
    <!-- 1. NOME DO SISTEMA NO TOPO -->
    <h1 class="app-title">VibePlay</h1>

    <!-- 2. ABAS DE NAVEGAÇÃO -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tab-videos">Vídeos</button>
      <button class="tab-btn" id="tab-musicas">Músicas</button>
    </div>

    <!-- 3. CAMPO DE PESQUISA -->
    <div class="search-box">
      <input type="text" id="youtube-url" class="search-input" placeholder="Cole o link do YouTube aqui...">
      <button class="search-btn" id="btn-search" title="Pesquisar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- MENSAGEM DE CARREGAMENTO -->
    <div class="loading-text" id="loading">Carregando informações do vídeo...</div>

    <!-- 4. CARD DE RESULTADOS -->
    <div class="result-card" id="result-card">
      
      <!-- INFORMAÇÕES DO VÍDEO (CAPA E TÍTULO) -->
      <div class="video-info">
        <img id="video-thumb" class="video-thumb" src="" alt="Capa do vídeo">
        <div class="video-details">
          <span id="video-title" class="video-title">Título do Vídeo</span>
        </div>
      </div>

      <!-- SEÇÃO MÚSICA -->
      <div class="options-section" id="section-musica">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff3b30"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          Música
        </div>
        <div class="options-grid">
          <label class="option-item">
            <input type="radio" name="format" value="mp3_128" checked>
            <div class="option-label">
              <span class="option-quality">128K (MP3)</span>
              <span class="option-size">Áudio</span>
            </div>
          </label>
          <label class="option-item">
            <input type="radio" name="format" value="m4a">
            <div class="option-label">
              <span class="option-quality">128K (M4A)</span>
              <span class="option-size">Áudio</span>
            </div>
          </label>
        </div>
      </div>

      <!-- SEÇÃO VÍDEO -->
      <div class="options-section" id="section-video">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff3b30"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 9l-4 2.5v-5l4 2.5z"/></svg>
          Vídeo
        </div>
        <div class="options-grid">
          <label class="option-item">
            <input type="radio" name="format" value="360p">
            <div class="option-label">
              <span class="option-quality">360P (MP4)</span>
              <span class="option-size">Vídeo</span>
            </div>
          </label>
          <label class="option-item">
            <input type="radio" name="format" value="720p">
            <div class="option-label">
              <span class="option-quality">720P HD (MP4)</span>
              <span class="option-size">Vídeo</span>
            </div>
          </label>
        </div>
      </div>

      <!-- BOTÃO GUARDAR -->
      <button class="btn-save" id="btn-save">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        GUARDAR
      </button>

    </div>

  </div>

  <!-- ==========================================
       LOGICA EM JAVASCRIPT (LIGAÇÃO COM A API)
       ========================================== -->
  <script>
    // ELEMENTOS DO DOM
    const btnSearch = document.getElementById('btn-search');
    const inputUrl = document.getElementById('youtube-url');
    const loading = document.getElementById('loading');
    const resultCard = document.getElementById('result-card');
    const videoThumb = document.getElementById('video-thumb');
    const videoTitle = document.getElementById('video-title');
    const btnSave = document.getElementById('btn-save');
    
    const tabVideos = document.getElementById('tab-videos');
    const tabMusicas = document.getElementById('tab-musicas');
    const sectionVideo = document.getElementById('section-video');
    const sectionMusica = document.getElementById('section-musica');

    let currentVideoData = null;

    // EVENTO DE COMPORTAMENTO DAS ABAS
    tabVideos.addEventListener('click', () => {
      tabVideos.classList.add('active');
      tabMusicas.classList.remove('active');
      sectionVideo.style.display = 'flex';
      sectionMusica.style.display = 'none';
    });

    tabMusicas.addEventListener('click', () => {
      tabMusicas.classList.add('active');
      tabVideos.classList.remove('active');
      sectionMusica.style.display = 'flex';
      sectionVideo.style.display = 'none';
    });

    // EVENTO DE CLIQUE NA LUPA
    btnSearch.addEventListener('click', fetchVideoData);

    // FUNÇÃO PARA BUSCAR DADOS DA API GRATUITA (Cobalt API)
    async function fetchVideoData() {
      const url = inputUrl.value.trim();

      if (!url) {
        alert('Por favor, cole um link válido do YouTube.');
        return;
      }

      // EXIBE O LOADING E OCULTA O CARD
      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        // Extrai o ID do vídeo para montar a capa (Thumbnail)
        const videoId = extractYouTubeID(url);
        
        if (videoId) {
          videoThumb.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
          videoTitle.innerText = "Vídeo localizado do YouTube";
        } else {
          videoThumb.src = "https://via.placeholder.com/90x60?text=Sem+Capa";
          videoTitle.innerText = "Conteúdo de mídia";
        }

        currentVideoData = { url: url };

        // REVELA O CARD DE RESULTADOS
        loading.style.display = 'none';
        resultCard.style.display = 'flex';

      } catch (error) {
        loading.style.display = 'none';
        alert('Erro ao buscar dados. Verifique a URL fornecida.');
      }
    }

    // EXTRAI O ID DO VÍDEO DO LINK DO YOUTUBE
    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // EVENTO DO BOTÃO GUARDAR (INTEGRAÇÃO COM A API GRATUITA DE DOWNLOAD)
    btnSave.addEventListener('click', async () => {
      if (!currentVideoData) return;

      const selectedFormat = document.querySelector('input[name="format"]:checked').value;
      
      btnSave.innerText = "PROCESSANDO...";
      btnSave.disabled = true;

      try {
        // Chamada à API Cobalt (API pública e gratuita de conversão)
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: currentVideoData.url,
            isAudioOnly: selectedFormat.includes('mp3') || selectedFormat.includes('m4a'),
            aBitrate: '128'
          })
        });

        const data = await response.json();

        if (data.url) {
          // Abre o link direto gerado para baixar o arquivo
          window.open(data.url, '_blank');
        } else {
          alert('Não foi possível gerar o link de download direto para este conteúdo.');
        }

      } catch (err) {
        alert('Erro ao processar o download através da API.');
      } finally {
        btnSave.innerText = "GUARDAR";
        btnSave.disabled = false;
      }
    });
  </script>
</body>
</html>
